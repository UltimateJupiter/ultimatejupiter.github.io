  <figcaption>Figure 5. Where the recurrent block sits. Each row is a model of about 136M parameters, parameter-matched to the Transformer baseline and trained on the same 10B FineWeb-Edu tokens. The strip shows the 30 layers and which of them recur (blue) or are looped (hatched), and the dot shows the selected score, blue above the baseline (dashed) and red below it. Switch between varying the block's size, moving a block of fixed size, and other ways to spend more compute, which unlike T²MLR also cost more at inference. Hover a row, or focus the chart and use ↑/↓, to see all scores. The finetuned tasks were evaluated only for the first set, except T²MLR(15,16). Zero-shot values are from Tables 1, 2 and 11 (accuracy in percent, normalized where available), and finetuned values from the bar labels of Figure 6 (pass@1).</figcaption>
