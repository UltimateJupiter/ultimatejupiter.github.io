  <figcaption>Figure 3. How far training gradients move when the recurrence is approximated with fewer iterations. For a checkpoint of T2MLR(5, 26) and one batch of 2048-token sequences, each cell compares the gradient under \((d_{\text{forward}}, d_{\text{backward}})\) with the gradient under the anchor \((32, 32)\), for all parameters, the fusion module, or layer 15; redder cells are farther from the anchor (relative \(\ell_2\) on a log scale that saturates at 10). With \(d_{\text{forward}} \ge 8\) and \(d_{\text{backward}} \ge 4\) the cosine similarity is at least 0.97 for all three, while with \(d_{\text{forward}} \le 4\) it is at most 0.68, and the fusion-module gradient points away from the anchor once \(d_{\text{forward}} \le 2\). Outlined: the training setting (16, 4). Hover a cell, or focus the chart and use the arrow keys, to read its value. Values from the paper's Figure 7 (Appendix B.3).</figcaption>
