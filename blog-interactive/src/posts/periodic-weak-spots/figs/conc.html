  <figcaption>Figure 4. Two ways a gate can concentrate. Each point is one KV head's key gate at the end of pretraining, placed by its static effective number of offsets \(\exp(H(\mathbb E[\boldsymbol\alpha]))\) (horizontal) and its per-window effective number \(\mathbb E[\exp(H(\boldsymbol\alpha))]\) (vertical). Both run from 1 (a single offset) to \(W\) (uniform). On the dashed diagonal, a gate gives each offset the same score in every window. At the right edge, its average over windows is uniform, however concentrated single windows are. For W8/S8 · 1 KV · seed 42, lines trace layers 9, 10, and 14 from step 1 (open circle) to step 47,518 (filled), and replay animates them. Color marks layer depth. Uniform averaging has no learned gate, and vector gates score every channel separately, so those runs are omitted.</figcaption>
