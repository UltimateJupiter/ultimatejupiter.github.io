  <figcaption>Figure 5. How often the trained model completes a phrasebook rule &ldquo;a b -&gt;&rdquo; with its correct output pair when the phrasebook text is fed back to it, for rules of the intermediate phrasebooks (\(\pi_1\)–\(\pi_4\), filled) and the last one (\(\pi_5\), hollow). Greedy decoding counts a rule as recovered when both tokens are the argmax; sampling reports the probability of the correct pair at temperature 1. Rows add token filters that help an adversary: forbidding &lt;THINK&gt;, or keeping only characters of the rule&rsquo;s output alphabet. The dashed line is a random guess of the pair (\(1/n^2\)). Values are means over 20 permutations of the phrasebook text, from Tables 2, 4 and 5 of the paper; the menu selects the model, and the scale control compares them with perfect recall.</figcaption>
