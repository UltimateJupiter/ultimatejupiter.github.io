  <figcaption>Figure 4. How informative the gradient is when rules are missing from the context, computed live in the soft surrogate model (temperature 1/25) with \(n = 10\), \(d = 10\) at initialization (\(W_i = 0\) in every layer), on random strings of 1,000 pairs. A dropped rule of \(\pi_1\) counts as predicted when the largest entry of the negative gradient on its column of \(W_1\) is the correct output pair (Definition B.1, chance 0.01); the sign option asks only that the correct entry's gradient be negative (chance 0.5), the quantity the released code computes for the paper's Figure 6. The first view drops rules from \(\pi_1\) only, for the pressed batch sizes; the second drops the same rules from \(\pi_1, \dots, \pi_k\), batch 10. Bands are 95% Wilson intervals over the dropped rules evaluated so far, treating them as independent (rules dropped in the same batch share strings, so the bands are somewhat narrow).</figcaption>
